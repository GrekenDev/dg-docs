<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DG Shops cover</title>
<link rel="stylesheet" href="shared.css" />
<style>
  html, body { width: 1990px; height: 480px; }

  body {
    background:
      radial-gradient(760px 460px at 1540px 280px, rgba(84, 206, 255, 0.24), transparent 65%),
      radial-gradient(520px 300px at 1930px 30px, rgba(61, 220, 151, 0.10), transparent 70%),
      radial-gradient(620px 380px at 200px 470px, rgba(84, 120, 255, 0.14), transparent 70%),
      linear-gradient(160deg, #0a1018 0%, #05080d 55%, #04060a 100%);
  }

  .ghost { left: -30px; bottom: -150px; font-size: 420px; }

  .copy { position: absolute; left: 110px; top: 58px; width: 960px; z-index: 5; }
  .title { margin-top: 30px; font-size: 168px; }
  .tagline { margin-top: 26px; font-size: 44px; }

  .shot--back {
    --s: 0.40; --fw: 1790; --fh: 1038; --x0: 65; --y0: 21; --r: 13px;
    left: 1400px; top: -26px;
    transform: perspective(2400px) rotateY(18deg) rotateX(5deg) rotateZ(-1deg);
    filter: brightness(0.6) saturate(0.9);
    z-index: 2;
  }

  .shot--front {
    --s: 0.44; --fw: 1684; --fh: 966; --x0: 118; --y0: 57; --r: 14px;
    left: 1190px; top: 66px;
    transform: perspective(2400px) rotateY(14deg) rotateX(4deg) rotateZ(-1deg);
    z-index: 3;
  }

  .item--gold   { width: 104px; left: 1330px; top: -12px; transform: rotate(-8deg); filter: drop-shadow(0 16px 16px rgba(0,0,0,.6)) blur(1px) brightness(.85); z-index: 1; }
  .item--burger { width: 150px; left: 940px; top: 40px; transform: rotate(-12deg); }
  .item--sprunk { width: 112px; left: 1858px; top: 236px; transform: rotate(18deg); }
  .item--water  { width: 86px;  left: 1132px; top: 352px; transform: rotate(-24deg); }

  .glow-floor { left: 1200px; top: 430px; width: 760px; height: 90px; }
</style>
</head>
<body>
  <div class="beam" style="left: 1060px;"></div>
  <div class="ghost">SHOPS</div>

  <section class="copy">
    <div class="chips">
      <span class="chip chip--accent"><i></i>FIVEM SCRIPT</span>
      <span class="chip">QBOX · QBCORE · ESX · ND_CORE</span>
    </div>
    <h1 class="title">DG SHOPS</h1>
    <p class="tagline">Turn every store into a <em>real business.</em></p>
  </section>

  <img class="item item--gold" src="assets/goldbar.png" alt="" />
  <div class="shot shot--back"><img src="../docs/.gitbook/assets/dg-shops-finances.png" alt="" /></div>
  <div class="glow-floor"></div>
  <div class="shot shot--front"><img src="../docs/.gitbook/assets/dg-shops-storefront.png" alt="" /></div>
  <img class="item item--burger" src="assets/burger.png" alt="" />
  <img class="item item--sprunk" src="assets/sprunk.png" alt="" />
  <img class="item item--water" src="assets/water.png" alt="" />
</body>
</html>
