<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>dg-bridge cover</title>
<link rel="stylesheet" href="shared.css" />
<link rel="stylesheet" href="bridge.css" />
<style>
  html, body { width: 1990px; height: 480px; }

  body {
    background:
      radial-gradient(760px 460px at 1500px 250px, rgba(84, 206, 255, 0.24), transparent 65%),
      radial-gradient(620px 380px at 200px 470px, rgba(84, 120, 255, 0.14), transparent 70%),
      linear-gradient(160deg, #0a1018 0%, #05080d 55%, #04060a 100%);
  }

  .ghost { left: -30px; bottom: -150px; font-size: 420px; }

  .copy { position: absolute; left: 110px; top: 58px; width: 960px; z-index: 5; }
  .title { margin-top: 30px; font-size: 168px; }
  .tagline { margin-top: 26px; font-size: 44px; }

  .modules {
    --tile-w: 190px; --tile-h: 112px; --gap: 16px; --pad: 18px; --radius: 18px; --icon: 40px; --label: 21px;
    left: 1130px;
    top: 44px;
    transform: perspective(2400px) rotateY(14deg) rotateX(4deg) rotateZ(-1deg);
  }

  .glow-floor { left: 1150px; top: 420px; width: 780px; height: 90px; }

  .streak--br { width: 420px; left: 1720px; top: 410px; transform: rotate(-46deg); opacity: 0.5; }
</style>
</head>
<body>
  <div class="beam" style="left: 1000px;"></div>
  <div class="ghost">BRIDGE</div>

  <section class="copy">
    <div class="chips">
      <span class="chip chip--accent"><i></i>FREE RESOURCE</span>
      <span class="chip">QBOX · QBCORE · ESX · ND_CORE</span>
    </div>
    <h1 class="title">DG BRIDGE</h1>
    <p class="tagline">One config. <em>Every framework.</em></p>
  </section>

  <div class="glow-floor"></div>

  <div class="modules">
    <div class="tile"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg></b><span>Framework</span></div>
    <div class="tile"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg></b><span>Inventory</span></div>
    <div class="tile"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></b><span>Target</span></div>
    <div class="tile"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10M9.5 21V10M14.5 21V10M19 21V10"/><path d="m12 3 9 5H3l9-5Z"/></svg></b><span>Banking</span></div>

    <div class="tile"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4l2-2Z"/><path d="M10 21h4"/></svg></b><span>Notifications</span></div>
    <div class="tile tile--hub"><img src="assets/dg-logo.png" alt="" /><span>dg-bridge</span></div>
    <div class="tile"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="6" rx="3"/><path d="M6 12h7"/></svg></b><span>Progress</span></div>
    <div class="tile"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M14 8h-4v8h4M10 12h3"/></svg></b><span>Text UI</span></div>

    <div class="tile"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg></b><span>Menus</span></div>
    <div class="tile"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18v-6a5 5 0 0 1 10 0v6"/><path d="M5 21h14v-3H5z"/><path d="M12 3v2M4.2 6.2l1.4 1.4M19.8 6.2l-1.4 1.4"/></svg></b><span>Dispatch</span></div>
    <div class="tile"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/></svg></b><span>Vehicle keys</span></div>
    <div class="tile"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16"/><path d="M3 21h13"/><path d="M7 8h5"/><path d="M15 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg></b><span>Fuel</span></div>
  </div>

  <div class="streak streak--br"></div>
</body>
</html>
