<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Home banner</title>
<link rel="stylesheet" href="shared.css" />
<style>
  html, body { width: 1990px; height: 480px; }

  body {
    background:
      radial-gradient(760px 460px at 1540px 280px, rgba(84, 206, 255, 0.24), transparent 65%),
      radial-gradient(620px 380px at 420px 170px, rgba(40, 120, 255, 0.16), transparent 70%),
      radial-gradient(520px 300px at 1930px 30px, rgba(61, 220, 151, 0.08), transparent 70%),
      linear-gradient(160deg, #0a1018 0%, #05080d 55%, #04060a 100%);
  }

  .ghost { left: -30px; bottom: -120px; font-size: 400px; }

  .copy { position: absolute; left: 110px; top: 50px; width: 980px; z-index: 5; }

  .lockup { display: flex; align-items: center; margin-top: 26px; }
  .lockup .logo { height: 150px; margin-left: -14px; }
  .lockup .divider {
    width: 2px;
    height: 120px;
    margin: 0 34px 0 26px;
    background: linear-gradient(180deg, transparent, #54ceff 20%, #54ceff 80%, transparent);
    box-shadow: 0 0 14px rgba(84, 206, 255, 0.7);
  }
  .lockup .wordmark { height: 118px; }

  .tagline { margin-top: 22px; font-size: 40px; }
  .sub { margin-top: 14px; font-size: 22px; }

  .shot--back {
    --s: 0.40; --fw: 1790; --fh: 1038; --x0: 65; --y0: 21; --r: 13px;
    left: 1400px;
    top: -26px;
    transform: perspective(2400px) rotateY(18deg) rotateX(5deg) rotateZ(-1deg);
    filter: brightness(0.6) saturate(0.9);
    z-index: 2;
  }

  .shot--front {
    --s: 0.44; --fw: 1684; --fh: 966; --x0: 118; --y0: 57; --r: 14px;
    left: 1190px;
    top: 66px;
    transform: perspective(2400px) rotateY(14deg) rotateX(4deg) rotateZ(-1deg);
    z-index: 3;
  }

  .item--gold   { width: 104px; left: 1330px; top: -12px; transform: rotate(-8deg); filter: drop-shadow(0 16px 16px rgba(0,0,0,.6)) blur(1px) brightness(.85); z-index: 1; }
  .item--burger { width: 146px; left: 1046px; top: 150px; transform: rotate(-12deg); }
  .item--sprunk { width: 112px; left: 1858px; top: 236px; transform: rotate(18deg); }
  .item--water  { width: 86px;  left: 1132px; top: 352px; transform: rotate(-24deg); }

  .glow-floor { left: 1200px; top: 430px; width: 760px; height: 90px; }

  .streak--tl { width: 460px; left: -150px; top: 96px; transform: rotate(-46deg); }
  .streak--tl2 { width: 300px; left: -120px; top: 40px; transform: rotate(-46deg); opacity: 0.5; }
  .streak--br { width: 420px; left: 1720px; top: 400px; transform: rotate(-46deg); opacity: 0.55; }
</style>
</head>
<body>
  <div class="beam" style="left: 1060px;"></div>
  <div class="ghost">GREKEN</div>
  <div class="streak streak--tl"></div>
  <div class="streak streak--tl2"></div>

  <section class="copy">
    <div class="chips">
      <span class="chip chip--accent"><i></i>FIVEM SCRIPTS</span>
      <span class="chip">QBOX · QBCORE · ESX · ND_CORE</span>
    </div>

    <div class="lockup">
      <img class="logo" src="assets/dg-logo.png" alt="" />
      <span class="divider"></span>
      <img class="wordmark" src="assets/wordmark.png" alt="" />
    </div>

    <p class="tagline">Premium FiveM scripts.<br /><em>One bridge, every framework.</em></p>
    <p class="sub">Player-run businesses, jobs, crime and police systems for roleplay servers.</p>
  </section>

  <img class="item item--gold" src="assets/goldbar.png" alt="" />
  <div class="shot shot--back"><img src="../docs/.gitbook/assets/dg-shops-finances.png" alt="" /></div>
  <div class="glow-floor"></div>
  <div class="shot shot--front"><img src="../docs/.gitbook/assets/dg-shops-storefront.png" alt="" /></div>
  <img class="item item--burger" src="assets/burger.png" alt="" />
  <img class="item item--sprunk" src="assets/sprunk.png" alt="" />
  <img class="item item--water" src="assets/water.png" alt="" />
  <div class="streak streak--br"></div>
</body>
</html>
